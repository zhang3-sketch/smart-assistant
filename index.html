<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>智能助手 · 终极版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0b1a2f; display: flex; justify-content: center; padding: 16px; min-height: 100vh; }
        #app { max-width: 1400px; width: 100%; background: #0f2140; border-radius: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); overflow: hidden; display: flex; flex-direction: column; height: 100vh; max-height: 100vh; }

        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 600px; padding: 24px; background: #0f2140; }
        .auth-card { background: #1a2f4f; border-radius: 28px; padding: 40px 32px; max-width: 420px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,0.3); border: 1px solid #2a4a6a; }
        .auth-card h2 { font-weight: 600; font-size: 24px; margin-bottom: 8px; color: #e8f0fe; }
        .auth-card p { color: #9bb7d4; font-size: 14px; margin-bottom: 28px; }
        .auth-input { width: 100%; padding: 14px 16px; border: 1.5px solid #2a4a6a; border-radius: 16px; font-size: 15px; margin-bottom: 16px; transition: 0.2s; background: #0f2140; color: #e8f0fe; }
        .auth-input:focus { border-color: #4a8af4; background: #162d50; outline: none; box-shadow: 0 0 0 3px rgba(74,138,244,0.2); }
        .auth-btn { width: 100%; padding: 14px; background: #1a5bbf; color: white; border: none; border-radius: 40px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .auth-btn:hover { background: #2a6df4; }
        .auth-switch { margin-top: 18px; text-align: center; color: #9bb7d4; font-size: 14px; }
        .auth-switch span { color: #4a8af4; font-weight: 600; cursor: pointer; }

        .main-layout { display: flex; flex-direction: column; height: 100%; flex: 1; min-height: 0; background: #0f2140; }
        .top-bar { padding: 12px 24px; background: #0f2140; border-bottom: 1px solid #1a3555; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; flex-shrink: 0; }
        .top-bar .brand { font-weight: 700; font-size: 18px; color: #e8f0fe; display: flex; align-items: center; gap: 8px; }
        .top-bar .brand i { color: #4a8af4; }
        .top-search { flex: 1; min-width: 180px; display: flex; background: #0a1a32; border-radius: 40px; padding: 4px 4px 4px 18px; align-items: center; border: 1px solid #1a3555; transition: 0.2s; position: relative; }
        .top-search:focus-within { border-color: #4a8af4; background: #0f2140; box-shadow: 0 0 0 3px rgba(74,138,244,0.15); }
        .top-search input { border: none; background: transparent; padding: 8px 0; flex: 1; font-size: 14px; outline: none; color: #e8f0fe; }
        .top-search input::placeholder { color: #6a8aaa; }
        .top-search i { color: #6a8aaa; font-size: 14px; }
        .top-search button { background: #1a5bbf; border: none; color: white; padding: 6px 16px; border-radius: 40px; font-weight: 500; cursor: pointer; font-size: 12px; }
        .top-search button:hover { background: #2a6df4; }
        .top-search .search-dropdown { position: absolute; top: 110%; left: 0; right: 0; background: #0a1a32; border: 1px solid #1a3555; border-radius: 16px; max-height: 250px; overflow-y: auto; z-index: 100; display: none; padding: 4px 0; }
        .top-search .search-dropdown .item { padding: 8px 16px; color: #d0dce8; font-size: 13px; border-bottom: 1px solid #1a3555; cursor: pointer; display: flex; justify-content: space-between; }
        .top-search .search-dropdown .item:hover { background: #0f2140; }
        .top-search .search-dropdown .item .badge-sm { font-size: 10px; background: #1a3555; color: #4a8af4; padding: 2px 8px; border-radius: 12px; }

        .user-badge { display: flex; align-items: center; gap: 12px; background: #0a1a32; padding: 4px 14px 4px 10px; border-radius: 40px; border: 1px solid #1a3555; flex-shrink: 0; color: #e8f0fe; font-size: 13px; }
        .user-badge i { color: #4a8af4; }
        .user-badge #logoutBtn { cursor: pointer; color: #8ab0d4; }
        .user-badge #logoutBtn:hover { color: #ff6b6b; }

        .body-wrap { display: flex; flex: 1; min-height: 0; overflow: hidden; }
        .sidebar { width: 200px; background: #0a1a32; border-right: 1px solid #1a3555; padding: 16px 0; overflow-y: auto; flex-shrink: 0; height: 100%; }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: #2a4a6a; border-radius: 8px; }
        .sidebar-item { padding: 10px 20px; display: flex; align-items: center; gap: 12px; color: #9bb7d4; font-weight: 500; cursor: pointer; transition: 0.1s; border-left: 3px solid transparent; font-size: 14px; }
        .sidebar-item i { width: 18px; color: #6a8aaa; font-size: 14px; }
        .sidebar-item.active { background: #0f2140; border-left-color: #4a8af4; color: #e8f0fe; box-shadow: inset 0 0 0 1px #1a3555; }
        .sidebar-item:hover { background: #0f2140; color: #e8f0fe; }

        .content { flex: 1; padding: 20px; overflow-y: auto; background: #0f2140; height: 100%; }
        .content::-webkit-scrollbar { width: 6px; }
        .content::-webkit-scrollbar-thumb { background: #2a4a6a; border-radius: 8px; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: #0a1a32; border-radius: 16px; padding: 14px 14px; border: 1px solid #1a3555; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .label { font-size: 11px; color: #6a8aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 22px; font-weight: 700; color: #e8f0fe; margin-top: 2px; }

        .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; align-items: center; position: relative; }
        .filter-bar select, .filter-bar input { padding: 8px 14px; border-radius: 40px; border: 1.5px solid #1a3555; background: #0a1a32; color: #e8f0fe; font-size: 13px; }
        .filter-bar select option { background: #0a1a32; }
        .filter-bar input::placeholder { color: #6a8aaa; }
        .filter-bar .btn { background: #1a5bbf; color: white; border: none; padding: 8px 18px; border-radius: 40px; font-weight: 500; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .filter-bar .btn:hover { background: #2a6df4; transform: scale(1.02); }
        .filter-bar .btn-primary { background: #2a6df4; }
        .filter-bar .btn-primary:hover { background: #4a8af4; }
        .filter-bar .btn-success { background: #1a8a4a; }
        .filter-bar .btn-success:hover { background: #2aaa5a; }
        .filter-bar .btn-warning { background: #c97d2a; }
        .filter-bar .btn-warning:hover { background: #e89a3a; }
        .filter-bar .btn-danger { background: #b33a3a; }
        .filter-bar .btn-danger:hover { background: #d44a4a; }
        .filter-bar .search-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #0a1a32; border: 1px solid #1a3555; border-radius: 16px; max-height: 220px; overflow-y: auto; z-index: 50; margin-top: 4px; padding: 4px 0; display: none; }
        .filter-bar .search-dropdown .item { padding: 8px 16px; color: #d0dce8; font-size: 13px; border-bottom: 1px solid #1a3555; cursor: pointer; display: flex; justify-content: space-between; }
        .filter-bar .search-dropdown .item:hover { background: #0f2140; }
        .filter-bar .search-dropdown .item .badge-sm { font-size: 10px; background: #1a3555; color: #4a8af4; padding: 2px 8px; border-radius: 12px; }

        .table-wrap { overflow-x: auto; max-height: 450px; overflow-y: auto; }
        .table-wrap::-webkit-scrollbar { width: 6px; }
        .table-wrap::-webkit-scrollbar-thumb { background: #2a4a6a; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 10px; background: #0a1a32; color: #9bb7d4; font-weight: 600; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #1a3555; }
        td { padding: 10px 10px; border-bottom: 1px solid #1a3555; color: #d0dce8; }
        .badge { background: #1a3555; color: #4a8af4; padding: 3px 10px; border-radius: 40px; font-size: 11px; font-weight: 600; }
        .badge-success { background: #1a4a3a; color: #4aca7a; }
        .badge-danger { background: #4a2a2a; color: #ff6b6b; }
        .badge-warning { background: #4a3a1a; color: #e8c84a; }
        .action-icon { margin: 0 3px; color: #6a8aaa; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .action-icon:hover { color: #e8f0fe; transform: scale(1.1); }
        .action-icon.success { color: #4aca7a; }
        .action-icon.success:hover { color: #6ada9a; }
        .action-icon.danger { color: #ff6b6b; }
        .action-icon.danger:hover { color: #ff8a8a; }
        .action-icon.info { color: #4a8af4; }
        .action-icon.info:hover { color: #6aaaF4; }

        .pagination { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; color: #9bb7d4; }
        .pagination select { padding: 4px 10px; border-radius: 30px; border: 1px solid #1a3555; background: #0a1a32; color: #e8f0fe; }

        .hidden { display: none; }
        .flex-col { display: flex; flex-direction: column; gap: 10px; }
        .drop-zone { border: 2px dashed #1a3555; border-radius: 16px; padding: 16px; text-align: center; cursor: pointer; transition: 0.3s; background: #0a1a32; }
        .drop-zone:hover, .drop-zone.dragover { border-color: #4a8af4; background: #0f2140; transform: scale(1.01); }
        .drop-zone i { color: #4a8af4; font-size: 28px; }
        .drop-zone p { color: #6a8aaa; font-size: 13px; }
        .drop-zone img { max-width: 100%; max-height: 120px; margin-top: 6px; border-radius: 10px; }

        .uncompleted-list { max-height: 280px; overflow-y: auto; background: #0a1a32; border-radius: 14px; padding: 10px; border: 1px solid #1a3555; }
        .uncompleted-list::-webkit-scrollbar { width: 4px; }
        .uncompleted-list::-webkit-scrollbar-thumb { background: #2a4a6a; border-radius: 8px; }
        .uncompleted-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid #1a3555; color: #d0dce8; font-size: 13px; }
        .uncompleted-item:last-child { border-bottom: none; }

        .salary-image { max-width: 80px; max-height: 80px; border-radius: 8px; cursor: pointer; border: 1px solid #1a3555; transition: 0.2s; }
        .salary-image:hover { transform: scale(1.05); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 999; animation: fadeIn 0.25s; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-box { background: #0f2140; border-radius: 24px; max-width: 650px; width: 92%; padding: 24px; max-height: 80vh; overflow-y: auto; border: 1px solid #1a3555; }
        .modal-box h3 { color: #e8f0fe; margin-bottom: 14px; font-size: 18px; }
        .modal-box .copy-btn { background: #1a5bbf; color: white; border: none; padding: 4px 14px; border-radius: 40px; cursor: pointer; font-size: 12px; }
        .modal-box .copy-btn:hover { background: #2a6df4; }
        .modal-box img { max-width: 100%; border-radius: 10px; }
        .modal-box button { margin-top: 14px; padding: 8px 22px; border-radius: 40px; border: none; background: #1a5bbf; color: white; cursor: pointer; }
        .modal-box button:hover { background: #2a6df4; }
        .modal-box .close-btn { background: #4a2a2a; margin-left: 10px; }
        .modal-box .close-btn:hover { background: #6a3a3a; }

        .progress-bar-wrap { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
        .progress-bar-label { width: 36px; color: #9bb7d4; font-size: 12px; font-weight: 600; }
        .progress-bar-track { flex: 1; height: 6px; background: #1a3555; border-radius: 6px; overflow: hidden; position: relative; cursor: pointer; }
        .progress-bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
        .progress-bar-fill.em0 { background: #4a8af4; }
        .progress-bar-fill.em1 { background: #4aca7a; }
        .progress-bar-fill.em2 { background: #e8c84a; }
        .progress-bar-fill.em3 { background: #ff6b6b; }
        .progress-tooltip { position: absolute; top: -24px; left: 50%; transform: translateX(-50%); background: #0a1a32; color: #e8f0fe; padding: 2px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; border: 1px solid #1a3555; display: none; }
        .progress-bar-track:hover .progress-tooltip { display: block; }

        .client-grid { display: grid; grid-template-columns: 1fr; gap: 6px; max-height: 450px; overflow-y: auto; padding-right: 4px; }
        .client-grid::-webkit-scrollbar { width: 4px; }
        .client-grid::-webkit-scrollbar-thumb { background: #2a4a6a; border-radius: 8px; }
        .client-card { background: #0a1a32; border: 1px solid #1a3555; border-radius: 12px; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; transition: 0.2s; }
        .client-card:hover { border-color: #4a8af4; }
        .client-card .field { color: #d0dce8; font-size: 13px; }
        .client-card .field strong { color: #9bb7d4; }
        .client-card .actions { margin-left: auto; display: flex; gap: 4px; align-items: center; }

        .ocr-layout { display: flex; gap: 16px; flex-wrap: wrap; }
        .ocr-left { flex: 2; min-width: 280px; }
        .ocr-right { flex: 1; min-width: 200px; background: #0a1a32; border-radius: 14px; padding: 14px; border: 1px solid #1a3555; max-height: 550px; overflow-y: auto; }
        .ocr-right::-webkit-scrollbar { width: 4px; }
        .ocr-right::-webkit-scrollbar-thumb { background: #2a4a6a; border-radius: 8px; }

        .history-item { display: flex; justify-content: space-between; padding: 5px 8px; border-bottom: 1px solid #1a3555; font-size: 12px; color: #d0dce8; }
        .history-item .match { color: #4aca7a; }
        .history-item .nomatch { color: #ff6b6b; }

        .pyramid-tree { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .pyramid-node { background: #0a1a32; border: 1px solid #1a3555; border-radius: 10px; padding: 4px 14px; color: #d0dce8; font-size: 13px; position: relative; transition: 0.2s; cursor: default; }
        .pyramid-node:hover { border-color: #4a8af4; }
        .pyramid-node .level-tag { color: #4a8af4; font-weight: 700; margin-right: 4px; }
        .pyramid-node .superior-arrow { color: #6a8aaa; margin: 0 4px; }
        .pyramid-node .node-count { font-size: 10px; color: #6a8aaa; margin-left: 6px; }

        .position-card { background: #0a1a32; border: 1px solid #1a3555; border-radius: 14px; padding: 14px; margin-bottom: 10px; transition: 0.2s; }
        .position-card:hover { border-color: #4a8af4; }
        .position-card .pos-title { color: #4a8af4; font-weight: 700; font-size: 15px; }
        .position-card .pos-detail { color: #d0dce8; font-size: 13px; margin: 3px 0; padding: 3px 8px; background: #0a1a32; border-radius: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .position-card .pos-detail .pay-info { color: #e8c84a; font-size: 12px; }
        .position-card .pos-detail .edit-btn { margin-left: auto; }

        .script-selector { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
        .script-selector select { padding: 8px 16px; border-radius: 40px; border: 1.5px solid #1a3555; background: #0a1a32; color: #e8f0fe; font-size: 13px; }
        .script-template-box { background: #0a1a32; border: 1px solid #1a3555; border-radius: 14px; padding: 14px; max-height: 350px; overflow-y: auto; }
        .script-template-item { padding: 8px 12px; border-bottom: 1px solid #1a3555; cursor: pointer; color: #d0dce8; transition: 0.2s; }
        .script-template-item:hover { background: #0f2140; }
        .script-template-item .label { color: #4a8af4; font-weight: 600; }

        .checkbox-col { width: 28px; text-align: center; }
        .checkbox-col input[type="checkbox"] { accent-color: #4a8af4; width: 14px; height: 14px; cursor: pointer; }

        .recognition-result { background: #0a1a32; border-radius: 10px; padding: 10px; margin-top: 10px; border: 1px solid #1a3555; }
        .recognition-result .result-item { display: flex; justify-content: space-between; padding: 3px 0; color: #d0dce8; font-size: 13px; border-bottom: 1px solid #1a3555; }
        .recognition-result .result-item:last-child { border-bottom: none; }
        .recognition-result .detected { color: #4aca7a; }
        .recognition-result .mismatch { color: #ff6b6b; }
        .recognition-result .ocr-loading { color: #e8c84a; font-style: italic; }

        .toast { position: fixed; bottom: 24px; right: 24px; background: #1a2f4f; color: #e8f0fe; padding: 14px 20px; border-radius: 14px; border: 1px solid #2a4a6a; box-shadow: 0 8px 30px rgba(0,0,0,0.5); z-index: 1000; animation: slideUp 0.3s; max-width: 380px; font-size: 14px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .toast .close { float: right; cursor: pointer; color: #6a8aaa; margin-left: 14px; }

        .tree-stats { display: flex; flex-wrap: wrap; gap: 12px; background: #0a1a32; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; border: 1px solid #1a3555; }
        .tree-stats .stat-item { font-size: 13px; color: #d0dce8; }
        .tree-stats .stat-item strong { color: #e8f0fe; }

        .client-table-header { display: grid; grid-template-columns: 40px 1fr 0.8fr 1fr 1fr 1.2fr 1.2fr; gap: 6px; padding: 8px 14px; color: #6a8aaa; font-size: 11px; font-weight: 600; border-bottom: 1px solid #1a3555; background: #0a1a32; border-radius: 12px 12px 0 0; }
        .client-table-row { display: grid; grid-template-columns: 40px 1fr 0.8fr 1fr 1fr 1.2fr 1.2fr; gap: 6px; padding: 8px 14px; align-items: center; border-bottom: 1px solid #1a3555; }
        .client-table-row .field { color: #d0dce8; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 职位薪水专用样式 */
        .position-member-card {
            background: #0a1a32;
            border: 1px solid #1a3555;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 6px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }
        .position-member-card:hover {
            border-color: #4a8af4;
            background: #0f2140;
        }
        .position-member-card .member-info {
            flex: 1;
            min-width: 200px;
        }
        .position-member-card .member-info .phone {
            color: #e8f0fe;
            font-weight: 600;
            font-size: 14px;
        }
        .position-member-card .member-info .detail {
            color: #9bb7d4;
            font-size: 12px;
            margin-top: 2px;
        }
        .position-member-card .member-info .detail span {
            margin-right: 12px;
        }
        .position-member-card .member-info .pay-badge {
            display: inline-block;
            background: #1a3555;
            color: #e8c84a;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin-left: 4px;
        }
        .position-member-card .member-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .position-member-card .member-actions .btn-sm {
            padding: 3px 12px;
            font-size: 11px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .position-member-card .member-actions .btn-edit {
            background: #1a5bbf;
            color: white;
        }
        .position-member-card .member-actions .btn-edit:hover {
            background: #2a6df4;
        }
        .position-member-card .member-actions .btn-pay {
            background: #1a8a4a;
            color: white;
        }
        .position-member-card .member-actions .btn-pay:hover {
            background: #2aaa5a;
        }
        .position-member-card .member-actions .btn-status {
            background: #4a3a1a;
            color: #e8c84a;
        }
        .position-member-card .member-actions .btn-status:hover {
            background: #6a5a2a;
        }
        .position-member-card .member-actions .btn-status.paid {
            background: #1a4a3a;
            color: #4aca7a;
        }

        .pay-history-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            border-bottom: 1px solid #1a3555;
            font-size: 12px;
            color: #d0dce8;
        }
        .pay-history-item:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) { .sidebar { width: 56px; } .sidebar-item span { display: none; } .sidebar-item { padding: 10px 14px; } .top-bar { flex-direction: column; align-items: stretch; } .ocr-layout { flex-direction: column; } .stat-grid { grid-template-columns: 1fr 1fr; } .client-table-header, .client-table-row { grid-template-columns: 30px 1fr 0.6fr 0.8fr 0.8fr 1fr 1fr; font-size: 11px; gap: 4px; padding: 6px 8px; } }

        .search-dropdown .item .highlight { color: #4a8af4; font-weight: 600; }
    </style>
</head>
<body>
<div id="app">
    <div id="authContainer" class="auth-container">
        <div class="auth-card">
            <h2 id="authTitle">📋 注册</h2>
            <p id="authSub">创建您的智能助手账户</p>
            <input id="authPhone" class="auth-input" placeholder="手机号 (3位及以上)" type="text">
            <input id="authPassword" class="auth-input" placeholder="密码 (6位)" type="password">
            <button id="authActionBtn" class="auth-btn">注册</button>
            <div class="auth-switch">已有账号？ <span id="toggleAuth">登录</span></div>
            <div id="authMessage" style="margin-top:10px; font-size:14px; color:#ff6b6b;"></div>
        </div>
    </div>

    <div id="mainApp" class="main-layout hidden">
        <div class="top-bar">
            <div class="brand"><i class="fas fa-robot"></i> 智能助手 <span style="font-size:11px;color:#4a8af4;">终极版</span></div>
            <div class="top-search" id="globalSearchContainer">
                <i class="fas fa-search"></i>
                <input id="globalSearch" placeholder="全局搜索 号码后4位...">
                <button id="globalSearchBtn"><i class="fas fa-arrow-right"></i></button>
                <div class="search-dropdown" id="globalSearchResults"></div>
            </div>
            <div class="user-badge">
                <i class="fas fa-user-circle"></i>
                <span id="userDisplay">管理员</span>
                <i class="fas fa-sign-out-alt" id="logoutBtn" title="登出"></i>
            </div>
        </div>
        <div class="body-wrap">
            <div class="sidebar" id="sidebarMenu">
                <div class="sidebar-item active" data-tab="dashboard"><i class="fas fa-chart-pie"></i><span>主页</span></div>
                <div class="sidebar-item" data-tab="clients"><i class="fas fa-users"></i><span>客户管理</span></div>
                <div class="sidebar-item" data-tab="inventory"><i class="fas fa-boxes"></i><span>库存管理</span></div>
                <div class="sidebar-item" data-tab="orders"><i class="fas fa-file-invoice"></i><span>订单识别</span></div>
                <div class="sidebar-item" data-tab="salary"><i class="fas fa-money-bill-wave"></i><span>薪水提款</span></div>
                <div class="sidebar-item" data-tab="scripts"><i class="fas fa-comment-dots"></i><span>话术生成</span></div>
                <div class="sidebar-item" data-tab="positions"><i class="fas fa-briefcase"></i><span>职位薪水</span></div>
                <div class="sidebar-item" data-tab="tree"><i class="fas fa-sitemap"></i><span>团队关系树</span></div>
            </div>
            <div class="content" id="contentArea"></div>
        </div>
    </div>
</div>

<script>
(function(){
    // ============================================================
    //  DATA LAYER
    // ============================================================
    let currentUser = null;
    let users = JSON.parse(localStorage.getItem('smart_users')) || [];
    let clients = JSON.parse(localStorage.getItem('smart_clients')) || [];
    let inventory = JSON.parse(localStorage.getItem('smart_inventory')) || [];
    let orders = JSON.parse(localStorage.getItem('smart_orders')) || [];
    let salaryRecords = JSON.parse(localStorage.getItem('smart_salary')) || [];
    let ocrHistory = JSON.parse(localStorage.getItem('smart_ocr_history')) || [];
    let positions = JSON.parse(localStorage.getItem('smart_positions')) || {
        intern: { name: '实习经理', bonus: 1500, bonusType: '一次性奖励', members: 3, payDay: 1 },
        formal: { name: '正式经理', bonus: 5000, bonusType: '每月固定收入', members: 8, payDay: 5 },
        regional: { name: '区域经理', bonus: 8000, bonusType: '每月固定收入', members: 20, payDay: 10 },
        market: { name: '市场经理', bonus: 12000, bonusType: '每月固定收入', members: 45, payDay: 15 },
        general: { name: '区域总经理', bonus: 20000, bonusType: '每月固定收入', members: 80, payDay: 20 }
    };
    let positionStatus = JSON.parse(localStorage.getItem('smart_position_status')) || {};
    // 每个客户的发放记录 { phone: { payCount: 0, lastPayDate: '', history: [] } }
    let positionPayRecords = JSON.parse(localStorage.getItem('smart_position_pay_records')) || {};
    let scriptTemplates = JSON.parse(localStorage.getItem('smart_script_templates')) || {
        recommend: { label: '推荐申请', templates: ['推荐申请话术-推荐恭喜话术1', '推荐申请话术-推荐恭喜话术2', '推荐申请话术-推荐恭喜话术3'] },
        lottery: { label: '抽奖申请', templates: ['抽奖申请话术-抽奖申请恭喜1', '抽奖申请话术-抽奖申请恭喜2', '抽奖申请话术-抽奖申请恭喜3'] },
        upgrade: { label: '升级恭喜', templates: ['恭喜话术1', '恭喜话术2', '恭喜话术3'] }
    };
    let currentTab = 'dashboard';
    let authMode = 'register';
    let selectedClients = new Set();
    let selectedInventory = new Set();
    let isProcessingOCR = false;
    let toastTimer = null;

    function saveAll(){
        localStorage.setItem('smart_users', JSON.stringify(users));
        localStorage.setItem('smart_clients', JSON.stringify(clients));
        localStorage.setItem('smart_inventory', JSON.stringify(inventory));
        localStorage.setItem('smart_orders', JSON.stringify(orders));
        localStorage.setItem('smart_salary', JSON.stringify(salaryRecords));
        localStorage.setItem('smart_ocr_history', JSON.stringify(ocrHistory));
        localStorage.setItem('smart_positions', JSON.stringify(positions));
        localStorage.setItem('smart_position_status', JSON.stringify(positionStatus));
        localStorage.setItem('smart_position_pay_records', JSON.stringify(positionPayRecords));
        localStorage.setItem('smart_script_templates', JSON.stringify(scriptTemplates));
        const now = Date.now();
        const thirtyDays = 30*24*60*60*1000;
        users = users.filter(u => (now - u.lastLogin) < thirtyDays);
        if(currentUser && !users.find(u=>u.phone===currentUser.phone)) {
            currentUser = null;
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('authContainer').classList.remove('hidden');
        }
        localStorage.setItem('smart_users', JSON.stringify(users));
    }

    function syncInventoryFromClients(){
        const clientPhones = new Set(clients.map(c=>c.phone));
        clients.forEach(c => {
            if(!inventory.find(i=>i.phone===c.phone)){
                inventory.push({ ...c, deleted: false, addedAt: new Date().toISOString() });
            }
        });
        inventory.forEach(i => {
            if(!clientPhones.has(i.phone) && !i.deleted){
                i.deleted = true;
            }
        });
        saveAll();
    }

    function getTodayCompleted(phone){
        return orders.some(o => o.phone === phone && o.date === new Date().toDateString() && o.completed);
    }

    function showToast(message, type = 'info'){
        const existing = document.querySelector('.toast');
        if(existing) existing.remove();
        if(toastTimer) clearTimeout(toastTimer);
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span class="close" onclick="this.parentElement.remove()">✕</span>${message}`;
        if(type === 'success') toast.style.borderColor = '#4aca7a';
        else if(type === 'error') toast.style.borderColor = '#ff6b6b';
        else if(type === 'warning') toast.style.borderColor = '#e8c84a';
        document.body.appendChild(toast);
        toastTimer = setTimeout(() => { toast.remove(); }, 4000);
    }

    function computeLevelsAndPositions(){
        const map = {};
        clients.forEach(c => { map[c.phone] = { ...c, children: [] }; });
        clients.forEach(c => {
            if(c.superior && map[c.superior]) {
                map[c.superior].children.push(c.phone);
            }
        });
        const roots = clients.filter(c => !c.superior || !map[c.superior]);
        const levelMap = {};
        function assignLevel(phone, level){
            levelMap[phone] = level;
            if(map[phone] && map[phone].children){
                map[phone].children.forEach(child => assignLevel(child, level + 1));
            }
        }
        roots.forEach(r => assignLevel(r.phone, 0));
        clients.forEach(c => {
            const lv = levelMap[c.phone];
            c.levelTag = lv !== undefined ? String.fromCharCode(65 + lv) : '?';
            c.levelNum = lv !== undefined ? lv : -1;
        });

        const superiorCount = {};
        clients.forEach(c => {
            if(c.superior) {
                superiorCount[c.superior] = (superiorCount[c.superior] || 0) + 1;
            }
        });

        clients.forEach(c => {
            const count = superiorCount[c.phone] || 0;
            let pos = null;
            if(count >= 80) pos = 'general';
            else if(count >= 45) pos = 'market';
            else if(count >= 20) pos = 'regional';
            else if(count >= 8) pos = 'formal';
            else if(count >= 3) pos = 'intern';
            c.position = pos;
            c.teamCount = count;
            if(pos) {
                c.positionName = positions[pos]?.name || pos;
                c.positionBonus = positions[pos]?.bonus || 0;
                c.positionBonusType = positions[pos]?.bonusType || '';
                c.positionPayDay = positions[pos]?.payDay || 1;
            } else {
                c.positionName = null;
                c.positionBonus = 0;
                c.positionBonusType = '';
                c.positionPayDay = 1;
            }
            // 发放记录
            const rec = positionPayRecords[c.phone] || { payCount: 0, lastPayDate: '', history: [] };
            c.payCount = rec.payCount || 0;
            c.lastPayDate = rec.lastPayDate || '';
        });
        saveAll();
    }

    // ============================================================
    //  AUTH
    // ============================================================
    function renderAuth(){
        const title = document.getElementById('authTitle');
        const sub = document.getElementById('authSub');
        const btn = document.getElementById('authActionBtn');
        const toggle = document.getElementById('toggleAuth');
        if(authMode === 'register'){
            title.innerText = '📋 注册';
            sub.innerText = '创建您的智能助手账户';
            btn.innerText = '注册';
            toggle.innerText = '登录';
        } else {
            title.innerText = '🔐 登录';
            sub.innerText = '登录您的智能助手';
            btn.innerText = '登录';
            toggle.innerText = '注册';
        }
    }

    document.getElementById('toggleAuth').addEventListener('click', function(){
        authMode = (authMode === 'register' ? 'login' : 'register');
        renderAuth();
        document.getElementById('authMessage').innerText = '';
    });

    document.getElementById('authActionBtn').addEventListener('click', function(){
        const phone = document.getElementById('authPhone').value.trim();
        const password = document.getElementById('authPassword').value.trim();
        const msg = document.getElementById('authMessage');
        msg.innerText = '';
        if(phone.length < 3){ msg.innerText = '手机号至少3位'; return; }
        if(password.length !== 6){ msg.innerText = '密码必须6位'; return; }
        if(authMode === 'register'){
            if(users.find(u=>u.phone===phone)){ msg.innerText = '该手机号已注册'; return; }
            users.push({ phone, password, lastLogin: Date.now() });
            saveAll();
            msg.innerText = '注册成功，请登录';
            authMode = 'login';
            renderAuth();
        } else {
            const user = users.find(u=>u.phone===phone && u.password===password);
            if(!user){ msg.innerText = '手机号或密码错误'; return; }
            user.lastLogin = Date.now();
            currentUser = user;
            saveAll();
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = phone;
            syncInventoryFromClients();
            computeLevelsAndPositions();
            renderTab(currentTab);
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', function(){
        currentUser = null;
        document.getElementById('mainApp').classList.add('hidden');
        document.getElementById('authContainer').classList.remove('hidden');
    });

    document.querySelectorAll('.sidebar-item').forEach(item => {
        item.addEventListener('click', function(){
            document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
            this.classList.add('active');
            currentTab = this.dataset.tab;
            renderTab(currentTab);
        });
    });

    function renderTab(tab){
        const area = document.getElementById('contentArea');
        if(tab === 'dashboard') renderDashboard(area);
        else if(tab === 'clients') renderClients(area);
        else if(tab === 'inventory') renderInventory(area);
        else if(tab === 'orders') renderOrders(area);
        else if(tab === 'salary') renderSalary(area);
        else if(tab === 'scripts') renderScripts(area);
        else if(tab === 'positions') renderPositions(area);
        else if(tab === 'tree') renderTree(area);
    }

    // ============================================================
    //  GLOBAL SEARCH
    // ============================================================
    const globalInput = document.getElementById('globalSearch');
    const globalResults = document.getElementById('globalSearchResults');

    globalInput.addEventListener('input', function(){
        const q = this.value.trim();
        if(q.length < 2) { globalResults.style.display = 'none'; return; }
        const results = clients.filter(c => c.phone.includes(q) || (c.name && c.name.toLowerCase().includes(q.toLowerCase())));
        if(results.length === 0) { globalResults.style.display = 'none'; return; }
        globalResults.innerHTML = results.slice(0, 10).map(c => `
            <div class="item" onclick="window.globalSearchSelect('${c.phone}')">
                <span>${c.phone} <span class="badge-sm">${c.level||'EM0'}</span> ${c.name ? '| '+c.name : ''}</span>
                <span style="color:#6a8aaa;font-size:11px;">上级: ${c.superior||'无'}</span>
            </div>
        `).join('');
        globalResults.style.display = 'block';
    });

    globalInput.addEventListener('blur', function(){ setTimeout(() => { globalResults.style.display = 'none'; }, 300); });
    globalInput.addEventListener('focus', function(){ if(this.value.trim().length >= 2) globalResults.style.display = 'block'; });

    window.globalSearchSelect = function(phone){
        const c = clients.find(x => x.phone === phone);
        if(!c) return;
        globalResults.style.display = 'none';
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-box">
                <h3>👤 客户详情</h3>
                <div style="color:#d0dce8;font-size:14px;line-height:1.8;">
                    <div><strong style="color:#9bb7d4;">账号：</strong>${c.phone}</div>
                    <div><strong style="color:#9bb7d4;">等级：</strong>${c.level || 'EM0'}</div>
                    <div><strong style="color:#9bb7d4;">名字：</strong>${c.name || '未设置'}</div>
                    <div><strong style="color:#9bb7d4;">上级：</strong>${c.superior || '无'}</div>
                    <div><strong style="color:#9bb7d4;">开始时间：</strong>${c.startTime || '未设置'}</div>
                    <div><strong style="color:#9bb7d4;">团队成员：</strong>${c.teamCount || 0} 人</div>
                    <div><strong style="color:#9bb7d4;">职位：</strong>${c.positionName || '无'}</div>
                    <div><strong style="color:#9bb7d4;">今日订单：</strong>${getTodayCompleted(c.phone) ? '✅ 已完成' : '⌛️ 未完成'}</div>
                </div>
                <div style="margin-top:12px;">
                    <button onclick="navigator.clipboard.writeText('${c.phone} | ${c.level||'EM0'} | ${c.name||''} | 上级:${c.superior||'无'}').then(() => showToast('已复制'))">📋 复制信息</button>
                    <button class="close-btn" onclick="this.closest('.modal-overlay').remove()">关闭</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    };

    document.getElementById('globalSearchBtn').addEventListener('click', function(){
        const q = globalInput.value.trim();
        if(q.length < 4) { showToast('请输入至少4位号码', 'error'); return; }
        const results = clients.filter(c => c.phone.includes(q));
        if(results.length === 0) { showToast('未找到匹配客户', 'error'); return; }
        globalSearchSelect(results[0].phone);
    });

    // ============================================================
    //  DASHBOARD
    // ============================================================
    function renderDashboard(area){
        const total = clients.length;
        const todayCompleted = orders.filter(o => o.date === new Date().toDateString() && o.completed).length;
        const uncompleted = total - todayCompleted;
        const rate = total > 0 ? Math.round((todayCompleted / total) * 100) : 0;
        const uncompletedClients = clients.filter(c => !getTodayCompleted(c.phone));

        const levels = ['EM0','EM1','EM2','EM3'];
        const counts = levels.map(l => clients.filter(c => c.level === l).length);
        const maxCount = Math.max(...counts, 1);
        let progressHTML = levels.map((l, i) => {
            const pct = Math.round((counts[i] / maxCount) * 100);
            const cls = l.toLowerCase();
            return `<div class="progress-bar-wrap">
                <span class="progress-bar-label">${l}</span>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill ${cls}" style="width:${pct}%;"></div>
                    <span class="progress-tooltip">${counts[i]} 人</span>
                </div>
                <span style="color:#6a8aaa;font-size:11px;min-width:28px;">${counts[i]}</span>
            </div>`;
        }).join('');

        area.innerHTML = `
            <div style="display:flex; gap:18px; flex-wrap:wrap;">
                <div style="flex:2; min-width:240px;">
                    <div class="stat-grid" style="grid-template-columns:1fr 1fr;">
                        <div class="stat-card"><div class="label">总客户</div><div class="value">${total}</div></div>
                        <div class="stat-card"><div class="label">总提现</div><div class="value">${salaryRecords.length}</div></div>
                        <div class="stat-card"><div class="label">提取次数</div><div class="value">${salaryRecords.length}</div></div>
                        <div class="stat-card"><div class="label">完成订单%</div><div class="value">${rate}%</div></div>
                    </div>
                    <div style="background:#0a1a32; padding:14px; border-radius:14px; border:1px solid #1a3555;">
                        <div style="color:#9bb7d4; font-weight:600; margin-bottom:6px; font-size:13px;">📊 等级分布</div>
                        ${progressHTML}
                    </div>
                    <div style="margin-top:12px; display:flex; gap:16px; flex-wrap:wrap; color:#d0dce8; font-size:14px;">
                        <div><strong style="color:#e8f0fe;">今日完成</strong> ${todayCompleted}</div>
                        <div><strong style="color:#e8f0fe;">昨日完成</strong> ${orders.filter(o => o.date === new Date(Date.now()-86400000).toDateString() && o.completed).length}</div>
                        <div><strong style="color:#e8f0fe;">今日进度</strong> ${total > 0 ? Math.round((todayCompleted/total)*100) : 0}%</div>
                    </div>
                </div>
                <div style="flex:1; min-width:180px; background:#0a1a32; border-radius:14px; padding:14px; border:1px solid #1a3555; max-height:320px; overflow-y:auto; align-self:flex-start;">
                    <div style="color:#9bb7d4; font-weight:600; margin-bottom:6px; font-size:13px;">⏳ 未完成订单 (${uncompletedClients.length})</div>
                    ${uncompletedClients.map(c => `
                        <div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #1a3555; font-size:13px; color:#d0dce8;">
                            <span>${c.phone} | ${c.level}</span>
                            <i class="fas fa-check action-icon success" onclick="window.completeOrderFromDashboard('${c.phone}')" title="标记完成"></i>
                        </div>
                    `).join('')}
                    ${uncompletedClients.length === 0 ? '<div style="color:#6a8aaa;padding:10px;text-align:center;">🎉 全部完成</div>' : ''}
                </div>
            </div>
        `;
        window.completeOrderFromDashboard = function(phone){
            if(!orders.find(o => o.phone === phone && o.date === new Date().toDateString())){
                orders.push({ phone, date: new Date().toDateString(), completed: true });
                saveAll();
                renderTab('dashboard');
            }
        };
    }

    // ============================================================
    //  CLIENTS
    // ============================================================
    function renderClients(area){
        let html = `
            <div class="filter-bar" style="position:relative;">
                <input placeholder="搜索名字/账号/等级" id="clientSearch" style="flex:1;min-width:120px;">
                <div class="search-dropdown" id="clientSearchResults"></div>
                <select id="levelFilter" style="min-width:100px;">
                    <option value="">全部等级</option>
                    <option value="EM0">EM0</option>
                    <option value="EM1">EM1</option>
                    <option value="EM2">EM2</option>
                    <option value="EM3">EM3</option>
                </select>
                <button class="btn" onclick="window.addSingleClient()">+ 添加</button>
                <button class="btn btn-primary" onclick="window.batchImport()">📥 批量</button>
                <button class="btn btn-danger" onclick="window.batchDeleteClients()">🗑️ 批量删除</button>
                <button class="btn btn-warning" onclick="window.toggleSelectAllClients()">☑️ 全选</button>
            </div>
            <div class="client-table-header">
                <span style="text-align:center;">☑️</span>
                <span>账户</span>
                <span>等级</span>
                <span>上级号码</span>
                <span>名字</span>
                <span>开始时间</span>
                <span style="text-align:right;">操作</span>
            </div>
            <div class="client-grid" id="clientGrid">
        `;
        clients.forEach(c => {
            const todayDone = getTodayCompleted(c.phone);
            const checked = selectedClients.has(c.phone) ? 'checked' : '';
            html += `
                <div class="client-table-row" data-phone="${c.phone}" data-level="${c.level || 'EM0'}">
                    <input type="checkbox" class="client-checkbox" data-phone="${c.phone}" ${checked} style="accent-color:#4a8af4;width:14px;height:14px;cursor:pointer;justify-self:center;">
                    <span class="field">${c.phone}</span>
                    <span class="field"><span class="badge">${c.level || 'EM0'}</span></span>
                    <span class="field">${c.superior || '--'}</span>
                    <span class="field">${c.name || '--'}</span>
                    <span class="field">${c.startTime || '--'}</span>
                    <span class="actions" style="justify-self:end;">
                        <span style="color:#d0dce8;font-size:12px;">${todayDone ? '✅完成' : '⌛️未完成'}</span>
                        <i class="fas fa-edit action-icon" onclick="window.editClient('${c.phone}')" title="编辑"></i>
                        <i class="fas fa-check action-icon success" onclick="window.completeOrderClient('${c.phone}')" title="完成"></i>
                        <i class="fas fa-times action-icon danger" onclick="window.cancelOrderClient('${c.phone}')" title="取消完成"></i>
                        <i class="fas fa-trash action-icon" onclick="window.deleteClient('${c.phone}')" title="删除"></i>
                    </span>
                </div>
            `;
        });
        html += `</div><div class="pagination"><span>每页 <select id="pageSize"><option>10</option><option>20</option><option>50</option><option>100</option></select></span></div>`;
        area.innerHTML = html;

        const levelFilter = document.getElementById('levelFilter');
        if(levelFilter){
            levelFilter.addEventListener('change', function(){

                if(results.length === 0) { searchResults.style.display = 'none'; return; }

                    <div class="item" onclick="document.getElementById('clientSearch').value='${c.phone}';searchResults.style.display='none';">
                        <span>${c.phone} <span class="badge-sm">${c.level||'EM0'}</span> ${c.name ? '| '+c.name : ''}</span>
                        <span style="color:#6a8aaa;font-size:11px;">上级: ${c.superior||'无'}</span>
                    </div>

                searchResults.style.display = 'block';

        window.toggleSelectAllClients = function(){

            const anyUnchecked = Array.from(allChecked).some(cb => !cb.checked);

            cb.addEventListener('change', function(){
                if(this.checked) selectedClients.add(this.dataset.phone);
                else selectedClients.delete(this.dataset.phone);

        window.batchDeleteClients = function(){
            const toDelete = Array.from(selectedClients);
            if(toDelete.length === 0) { showToast('请先选择要删除的客户', 'error'); return; }
            if(confirm(`确定要删除 ${toDelete.length} 个客户吗？`)){
                clients = clients.filter(c => !toDelete.includes(c.phone));
                selectedClients.clear();
                syncInventoryFromClients();
                computeLevelsAndPositions();
                saveAll();
                showToast(`✅ 已删除 ${toDelete.length} 个客户`, 'success');
                renderTab('clients');
            }
        };

        window.editClient = function(phone){
            const c = clients.find(x => x.phone === phone);
            if(!c) return;
            const newPhone = prompt('工作账户 (6-15位数字)', c.phone);
            if(!newPhone || newPhone.length<6 || newPhone.length>15) return showToast('账号需6-15位数字', 'error');
            const newLevel = prompt('等级 (EM0-EM3)', c.level);
            if(!['EM0','EM1','EM2','EM3'].includes(newLevel)) return showToast('等级无效', 'error');
            const newSuperior = prompt('上级号码', c.superior || '');
            const newName = prompt('名字', c.name || '');
            const newStart = prompt('开始工作时间', c.startTime || '');
            if(newPhone !== c.phone && clients.find(x => x.phone === newPhone)) {
                return showToast('该账号已存在', 'error');
            }
            const idx = clients.indexOf(c);
            clients[idx] = { ...c, phone: newPhone, level: newLevel, superior: newSuperior, name: newName, startTime: newStart };
            syncInventoryFromClients();
            computeLevelsAndPositions();
            saveAll();
            showToast('✅ 客户已更新', 'success');
            renderTab('clients');
        };

        window.addSingleClient = function(){
            const phone = prompt('输入工作账户(6-15位数字)');
            if(!phone || phone.length < 6 || phone.length > 15) { showToast('账号需6-15位数字', 'error'); return; }
            if(clients.find(c => c.phone === phone)) { showToast('该账号已存在', 'error'); return; }
            const name = prompt('名字') || '';
            const level = prompt('等级 (EM0-EM3)') || 'EM0';
            const superior = prompt('上级号码') || '';
            const startTime = prompt('开始工作时间 (格式: YYYY-MM-DD HH:mm:ss)') || '';
            clients.push({ phone, name, level, superior, startTime, workHours: 0 });
            syncInventoryFromClients();
            computeLevelsAndPositions();
            saveAll();
            showToast('✅ 客户已添加', 'success');
            renderTab('clients');
        };

        window.batchImport = function(){
            const raw = prompt(
                '请粘贴要导入的客户数据（每5行一组）：\n\n' +
                '格式：工作账户\n等级(EM0-EM3)\n上级号码\n名字\n开始工作时间\n\n' +
                '示例：\n0509782602\nEM1\n380950372797\nНадія\n2026-08-24 12:58:59'
            );
            if (!raw) return;
            const lines = raw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            let imported = 0, errors = [];
            for (let i = 0; i < lines.length; i += 5) {
                const group = lines.slice(i, i + 5);
                if (group.length < 5) {
                    errors.push(`第 ${Math.floor(i/5)+1} 组数据不完整`);
                    continue;
                }
                const [phone, level, superior, name, startTime] = group.map(s => s.trim());
                if (!/^\d{6,15}$/.test(phone)) { errors.push(`账号 "${phone}" 格式错误`); continue; }
                if (!['EM0','EM1','EM2','EM3'].includes(level)) { errors.push(`等级 "${level}" 无效`); continue; }
                if (clients.find(c => c.phone === phone)) { errors.push(`账号 "${phone}" 已存在`); continue; }
                clients.push({ phone, level, superior, name, startTime, workHours: 0 });
                imported++;
            }
            syncInventoryFromClients();
            computeLevelsAndPositions();
            saveAll();
            showToast(`✅ 成功导入 ${imported} 个客户`, 'success');
            renderTab('clients');
        };

        window.completeOrderClient = function(phone){
            if(!orders.find(o => o.phone === phone && o.date === new Date().toDateString())){
                orders.push({ phone, date: new Date().toDateString(), completed: true });
                saveAll();
                renderTab('clients');
            }
        };
        window.cancelOrderClient = function(phone){
            orders = orders.filter(o => !(o.phone === phone && o.date === new Date().toDateString()));
            saveAll();
            renderTab('clients');
        };
        window.deleteClient = function(phone){
            if(confirm('删除该客户？库存中会保留记录')) {
                clients = clients.filter(c => c.phone !== phone);
                selectedClients.delete(phone);
                syncInventoryFromClients();
                computeLevelsAndPositions();
                saveAll();
                showToast('✅ 客户已删除', 'success');
                renderTab('clients');
            }
        };
    }

    // ============================================================
    //  ORDERS (OCR)
    // ============================================================
    function renderOrders(area){
        const total = clients.length;

        const uncompleted = total - todayCompleted;

        area.innerHTML = `
            <div class="ocr-layout">
                <div class="ocr-left">
                    <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr;">
                        <div class="stat-card"><div class="label">总用户</div><div class="value">${total}</div></div>
                        <div class="stat-card"><div class="label">已完成</div><div class="value">${todayCompleted}</div></div>
                        <div class="stat-card"><div class="label">未完成</div><div class="value">${uncompleted}</div></div>
                    </div>
                    <div class="drop-zone" id="ocrDropZone" style="min-height:100px;">
                        <i class="fas fa-cloud-upload-alt" style="font-size:24px;"></i>
                        <p>拖拽照片到这里，或点击上传 (支持多选/连续拖入)</p>
                        <input type="file" id="ocrFileInput" accept="image/*" multiple style="display:none;">
                        <div id="ocrPreview" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;"></div>
                    </div>
                    <div class="recognition-result" id="recognitionResult">
                        <div style="color:#9bb7d4;font-weight:600;margin-bottom:6px;font-size:13px;">🔍 识别结果</div>
                        <div id="recognitionDetails">等待识别...</div>
                    </div>
                    <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
                        <button class="btn btn-success" onclick="window.manualCompleteOrder()">✅ 手动完成</button>
                        <button class="btn btn-warning" onclick="window.helpCompleteOrder()">🆘 帮助完成</button>
                        <button class="btn btn-danger" onclick="window.clearHistory()">🗑️ 清空历史</button>
                    </div>
                    <div style="margin-top:10px; background:#0a1a32; border-radius:12px; padding:10px; border:1px solid #1a3555; max-height:160px; overflow-y:auto;">
                        <div style="color:#9bb7d4; font-weight:600; margin-bottom:4px; font-size:12px;">📋 识别历史</div>
                        ${ocrHistory.slice().reverse().slice(0, 20).map(h => `
                            <div class="history-item">
                                <span>${h.time || ''}</span>
                                <span>${h.phone || ''}</span>
                                <span class="${h.matched ? 'match' : 'nomatch'}">${h.matched ? '✅ 匹配' : '❌ 不匹配'}</span>
                                ${h.detectedLevel ? `<span class="badge" style="font-size:10px;">${h.detectedLevel}</span>` : ''}
                                ${h.levelUpdated ? `<span style="color:#e8c84a;font-size:11px;">🔄 已更新</span>` : ''}
                            </div>
                        `).join('')}
                        ${ocrHistory.length === 0 ? '<div style="color:#6a8aaa;padding:6px;text-align:center;">暂无记录</div>' : ''}
                    </div>
                </div>
                <div class="ocr-right">
                    <div style="color:#9bb7d4; font-weight:600; margin-bottom:6px; font-size:13px;">📋 订单列表</div>
                    <div style="display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px;">
                        <button class="btn btn-sm" style="padding:3px 10px;font-size:11px;" onclick="window.filterOrders('all')">全部</button>
                        <button class="btn btn-sm btn-success" style="padding:3px 10px;font-size:11px;" onclick="window.filterOrders('done')">已完成</button>
                        <button class="btn btn-sm btn-warning" style="padding:3px 10px;font-size:11px;" onclick="window.filterOrders('undone')">未完成</button>
                        <input placeholder="搜索" id="orderSearchRight" style="padding:4px 10px;border-radius:40px;border:1px solid #1a3555;background:#0a1a32;color:#e8f0fe;font-size:11px;flex:1;min-width:70px;">
                        <button class="btn btn-sm" style="padding:3px 10px;font-size:11px;" onclick="window.resetToday()">重置今日</button>
                    </div>
                    <div id="orderListRight" style="max-height:350px;overflow-y:auto;">
                        ${clients.map(c => {
                            const done = getTodayCompleted(c.phone);
                            const lv = c.levelTag || '?';
                            return `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1a3555;font-size:12px;color:#d0dce8;" data-phone="${c.phone}" data-done="${done}">
                                <span><span class="badge" style="font-size:9px;padding:1px 6px;">${lv}</span> ${c.name || c.phone}</span>
                                <span>${c.phone}</span>
                                <span>${c.level}</span>
                                <span>${done ? '✅完成' : '⌛️未完成'}</span>
                                <span>
                                    ${done ? 
                                        `<i class="fas fa-times action-icon danger" onclick="window.cancelOrderRight('${c.phone}')" title="取消完成"></i>` :
                                        `<i class="fas fa-check action-icon success" onclick="window.completeOrderRight('${c.phone}')" title="完成"></i>`
                                    }
                                </span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            </div>
        `;

        const dropZone = document.getElementById('ocrDropZone');
        const fileInput = document.getElementById('ocrFileInput');
        const preview = document.getElementById('ocrPreview');
        const resultDetails = document.getElementById('recognitionDetails');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if(e.dataTransfer.files.length > 0) {
                for(let f of e.dataTransfer.files) {
                    if(f.type.startsWith('image/')) handleOCRFile(f);
                }
            }
        });
        fileInput.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                for(let f of e.target.files) {
                    if(f.type.startsWith('image/')) handleOCRFile(f);
                }
            }
            fileInput.value = '';
        });

        async function handleOCRFile(file){
            if (isProcessingOCR) {
                showToast('正在处理上一张图片，请稍候...', 'warning');
                return;
            }
            isProcessingOCR = true;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const imageData = e.target.result;
                const img = document.createElement('img');
                img.src = imageData;
                img.style.maxWidth = '60px';
                img.style.maxHeight = '60px';
                img.style.borderRadius = '6px';
                img.style.border = '1px solid #1a3555';
                preview.appendChild(img);

                const time = new Date().toLocaleString();
                let detectedPhone = null;
                let detectedLevel = null;
                let matched = false;
                let levelUpdated = false;

                try {
                    const recognizedText = await performOCR(imageData);
                    if (recognizedText) {
                        const result = extractPhoneAndLevel(recognizedText);
                        detectedPhone = result.phone;
                        detectedLevel = result.level;

                        let resultHTML = '';
                        if (detectedPhone) {
                            const client = clients.find(c => c.phone === detectedPhone);
                            resultHTML += `<div class="result-item"><span>👤 用户：</span><span class="detected">${detectedPhone}</span></div>`;
                            if (client) {
                                matched = true;
                                if (detectedLevel && client.level !== detectedLevel) {
                                    client.level = detectedLevel;
                                    levelUpdated = true;
                                    resultHTML += `<div class="result-item"><span>📊 等级：</span><span style="color:#e8c84a;">${detectedLevel} (已更新)</span></div>`;
                                    syncInventoryFromClients();
                                    computeLevelsAndPositions();
                                    saveAll();
                                } else if (detectedLevel) {
                                    resultHTML += `<div class="result-item"><span>📊 等级：</span><span>${detectedLevel}</span></div>`;
                                } else {
                                    resultHTML += `<div class="result-item"><span>📊 等级：</span><span style="color:#6a8aaa;">未检测到</span></div>`;
                                }
                                if(!orders.find(o => o.phone === detectedPhone && o.date === new Date().toDateString())){
                                    orders.push({ phone: detectedPhone, date: new Date().toDateString(), completed: true });
                                    saveAll();
                                    resultHTML += `<div class="result-item"><span>✅ 订单：</span><span class="detected">今日已完成</span></div>`;
                                } else {
                                    resultHTML += `<div class="result-item"><span>ℹ️ 订单：</span><span>今日已标记</span></div>`;
                                }
                            } else {
                                matched = false;
                                resultHTML += `<div class="result-item"><span>⚠️ 状态：</span><span class="nomatch">未找到匹配客户</span></div>`;
                            }
                        } else {
                            resultHTML = `<div style="color:#6a8aaa;padding:6px;">未识别到有效号码（需要6-15位数字）</div>`;
                        }
                        resultDetails.innerHTML = resultHTML;
                    } else {
                        resultDetails.innerHTML = `<div style="color:#ff6b6b;padding:6px;">❌ OCR识别失败</div>`;
                    }
                } catch (error) {
                    resultDetails.innerHTML = `<div style="color:#ff6b6b;padding:6px;">❌ 识别出错: ${error.message}</div>`;
                }

                ocrHistory.push({ time, phone: detectedPhone || '未识别', matched, detectedLevel, levelUpdated });
                saveAll();
                isProcessingOCR = false;
                renderTab('orders');
            };
            reader.readAsDataURL(file);
        }

        async function performOCR(imageData) {
            try {
                const result = await Tesseract.recognize(imageData, 'ukr+eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const detail = document.getElementById('recognitionDetails');
                            if(detail) detail.innerHTML = `<div class="ocr-loading">🔍 识别中... ${Math.round(m.progress * 100)}%</div>`;
                        }
                    }
                });
                return result.data.text;
            } catch (error) {
                console.error('OCR识别失败:', error);
                return null;
            }
        }

        function extractPhoneAndLevel(text) {
            const phoneMatch = text.match(/\b\d{6,15}\b/);
            const levelMatch = text.match(/EM[0-3]/i);
            return {
                phone: phoneMatch ? phoneMatch[0] : null,
                level: levelMatch ? levelMatch[0].toUpperCase() : null
            };
        }

        document.getElementById('orderSearchRight')?.addEventListener('input', function(){
            const q = this.value.toLowerCase();
            document.querySelectorAll('#orderListRight > div').forEach(el => {
                const text = el.innerText.toLowerCase();
                el.style.display = text.includes(q) ? '' : 'none';
            });
        });

        window.filterOrders = function(filter){
            document.querySelectorAll('#orderListRight > div').forEach(el => {

            const val = this.value;
            window._selectedCategory = val;
            renderTemplates(val);
            const searchVal = document.getElementById('scriptSearch').value.trim().toLowerCase();
            if(searchVal) filterTemplates(val, searchVal);
        });

        document.getElementById('scriptSearch').addEventListener('input', function(){
            const cat = document.getElementById('scriptCategorySelect').value;
            if(!cat) return;
            const q = this.value.trim().toLowerCase();
            filterTemplates(cat, q);
        });

        function filterTemplates(cat, q){
            const box = document.getElementById('scriptTemplateBox');
            if(!cat || !scriptTemplates[cat]) return;
            const templates = scriptTemplates[cat].templates || [];
            if(!q) { renderTemplates(cat); return; }
            const filtered = templates.filter(t => t.toLowerCase().includes(q));
            if(filtered.length === 0) {
                box.innerHTML = '<div style="color:#6a8aaa;padding:16px;text-align:center;">未找到匹配的话术</div>';
                return;
            }
            box.innerHTML = filtered.map((t, idx) => `
                <div class="script-template-item" data-index="${idx}" onclick="window.selectScriptTemplate('${cat}', ${templates.indexOf(t)})">
                    <div class="label">📝 模板 ${templates.indexOf(t)+1}</div>
                    <div style="color:#d0dce8;font-size:13px;margin-top:2px;">${t}</div>
                </div>
            `).join('');
        }

        window.selectScriptTemplate = function(category, index){
            const templates = scriptTemplates[category]?.templates || [];
            if(index < 0 || index >= templates.length) return;
            window._selectedScript = templates[index];
            window._selectedCategory = category;
            document.querySelectorAll('.script-template-item').forEach(el => {
                el.style.background = '';
            });
            const items = document.querySelectorAll('.script-template-item');
            if(items[index]) items[index].style.background = '#0f2140';
            showToast('已选中话术模板', 'success');
        };

        window.addScriptTemplate = function(){
            const cat = document.getElementById('scriptCategorySelect').value;
            if(!cat) { showToast('请先选择话术类型', 'error'); return; }
            const newText = prompt('请输入新话术内容：');
            if(newText && newText.trim()) {

                scriptTemplates[cat].templates.push(newText.trim());
                saveAll();
                renderTemplates(cat);
                showToast('✅ 话术已添加', 'success');
            }
        };

        window.copySelectedScript = function(){
            if(window._selectedScript) {
                navigator.clipboard?.writeText(window._selectedScript).then(() => {
                    showToast('✅ 话术已复制', 'success');
                }).catch(() => {
                    alert('复制失败，请手动复制');
                });
            } else {
                showToast('请先选择一条话术模板', 'error');
            }
        };

        renderTemplates('');
    }

    // ============================================================
    //  TREE (默认显示全部 + 搜索过滤)
    // ============================================================
    function renderTree(area){
        const map = {};
        clients.forEach(c => { map[c.phone] = { ...c, children: [] }; });
        clients.forEach(c => {
            if(c.superior && map[c.superior]) {
                map[c.superior].children.push(c.phone);
            }
        });
        const roots = clients.filter(c => !c.superior || !map[c.superior]);

        function buildPyramid(phone, level, visited = new Set()) {
            if (visited.has(phone)) return '';
            visited.add(phone);
            const c = map[phone];
            if (!c) return '';
            const levelLetter = String.fromCharCode(65 + level);
            const childrenHTML = c.children.map(child => {
                const childLevel = level + 1;
                return buildPyramid(child, childLevel, visited);
            }).join('');
            return `<div style="display:flex;flex-direction:column;align-items:center;padding:3px 0;width:100%;">
                <div class="pyramid-node" data-phone="${c.phone}" data-level="${level}" style="border-color: ${level === 0 ? '#4a8af4' : '#1a3555'};">
                    <span class="level-tag">${levelLetter}</span>
                    <span>${c.phone}</span>
                    <span class="badge" style="font-size:9px;margin-left:4px;">${c.level || 'EM0'}</span>
                    ${c.superior ? `<span class="superior-arrow">↑${c.superior}</span>` : ''}
                    <span class="node-count">(${c.children.length} 下级)</span>
                </div>
                ${c.children.length > 0 ? 
                    `<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px 24px;padding-top:6px;width:100%;">${childrenHTML}</div>` : ''
                }
            </div>`;
        }

        let treeHTML = '';
        if (roots.length === 0) {
            const orphanRoots = clients.filter(c => !c.superior);
            if (orphanRoots.length === 0 && clients.length > 0) {
                const allSuperiors = new Set(clients.map(c => c.superior).filter(s => s));
                const topLevel = clients.filter(c => !allSuperiors.has(c.phone) || !c.superior);
                topLevel.forEach(r => { treeHTML += buildPyramid(r.phone, 0); });
            } else {
                orphanRoots.forEach(r => { treeHTML += buildPyramid(r.phone, 0); });
            }
        } else {
            roots.forEach(r => { treeHTML += buildPyramid(r.phone, 0); });
        }

        if (!treeHTML) {
            treeHTML = '<div style="color:#6a8aaa;text-align:center;padding:30px;">暂无客户数据</div>';
        }

        const totalMembers = clients.length;
        const maxLevel = Math.max(...clients.map(c => c.levelNum).filter(n => n >= 0), -1);
        const levelCounts = {};
        clients.forEach(c => {
            if(c.levelNum >= 0) {
                levelCounts[c.levelNum] = (levelCounts[c.levelNum] || 0) + 1;
            }
        });
        const levelStats = Object.keys(levelCounts).sort((a,b) => a-b).map(l => `${String.fromCharCode(65+parseInt(l))}: ${levelCounts[l]}人`).join(' | ');

        area.innerHTML = `
            <div style="color:#e8f0fe;font-size:17px;margin-bottom:8px;">🌳 团队关系树 <span style="font-size:12px;color:#6a8aaa;">(A-Z 层级)</span></div>
            <div class="tree-stats">
                <span class="stat-item"><strong>总成员:</strong> ${totalMembers}</span>
                <span class="stat-item"><strong>最深层级:</strong> ${maxLevel >= 0 ? String.fromCharCode(65+maxLevel) : '无'}</span>
                <span class="stat-item"><strong>层级分布:</strong> ${levelStats || '无'}</span>
            </div>
            <div class="filter-bar">
                <input placeholder="搜索号码 (后4位) 显示团队" id="treeSearch" style="flex:1;min-width:120px;">
                <span style="font-size:11px;color:#6a8aaa;">默认显示全部，搜索后只显示匹配结果</span>
            </div>
            <div style="background:#0a1a32;border-radius:14px;padding:16px;border:1px solid #1a3555;max-height:500px;overflow-y:auto;">
                <div class="pyramid-tree" id="pyramidContainer">
                    ${treeHTML}
                </div>
            </div>
        `;

        const treeInput = document.getElementById('treeSearch');
        if(treeInput){
            treeInput.addEventListener('input', function(){
                const q = this.value.trim();
                const nodes = document.querySelectorAll('#pyramidContainer .pyramid-node');
                const allParents = document.querySelectorAll('#pyramidContainer > div');

                if(q.length < 2) {
                    allParents.forEach(p => p.style.display = '');
                    nodes.forEach(n => n.style.borderColor = n.dataset.level === '0' ? '#4a8af4' : '#1a3555');
                    return;
                }

                const matchedPhones = new Set();
                clients.forEach(c => {
                    if(c.phone.includes(q)) {
                        const stack = [c.phone];
                        while(stack.length > 0) {
                            const current = stack.pop();
                            matchedPhones.add(current);
                            if(map[current] && map[current].children) {
                                map[current].children.forEach(child => stack.push(child));
                            }
                        }
                    }
                });

                allParents.forEach(p => {
                    const hasMatch = p.querySelector('.pyramid-node') && 
                        p.querySelector('.pyramid-node').dataset.phone && 
                        matchedPhones.has(p.querySelector('.pyramid-node').dataset.phone);
                    p.style.display = hasMatch ? '' : 'none';
                });

                nodes.forEach(n => {
                    if(matchedPhones.has(n.dataset.phone)) {
                        n.style.borderColor = '#4aca7a';
                    } else {
                        n.style.borderColor = '#1a3555';
                    }
                });

                if(matchedPhones.size === 0) {
                    allParents.forEach(p => p.style.display = 'none');
                }
            });
        }
    }

    // ============================================================
    //  INIT
    // ============================================================
    setInterval(() => { saveAll(); }, 60000);
    renderAuth();
    if(currentUser){
        document.getElementById('authContainer').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = currentUser.phone;
        syncInventoryFromClients();
        computeLevelsAndPositions();
        renderTab('dashboard');
    }
})();
</script>
</body>
</html>
